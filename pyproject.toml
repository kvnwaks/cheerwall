[project]
name = "house"
version = "0.1.0"
readme = "README.md"
settings = "app.settings"
authors = [{ name = "Kevin Wakhisi", email = "kevin@treeolive.tech" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "djangx[vercel]>=0.1.0.dev6",
    "django-http-compression[brotli]>=1.4.0",
    "django-minify-html>=1.14.0",
    "django-browser-reload>=1.21.0",

    # rest framework
    "djangorestframework>=3.18.3",
    "django-filter>=26.2",
    "markdown>=3.11.2",
]

[dependency-groups]
dev = ["django-stubs>=6.1.2", "djlint>=1.46.6", "poethepoet>=0.49.0"]

[tool.uv]
preview-features = ["format-command", "check-command"]

[tool.poe.tasks.format]
help = "Format Python, Django HTML"
sequence = [{ cmd = "uv format" }, { cmd = "djlint . --reformat" }]

[tool.poe.tasks.lint]
help = "Run all linters and Django checks"
sequence = [
    { cmd = "uv lock --check" },
    { cmd = "uv format --check" },
    { cmd = "uv check" },
    { cmd = "djlint . --check" },
    { cmd = "djlint . --lint" },
    { cmd = "djx check" },
    { cmd = "djx makemigrations --check --dry-run" },
]

[tool.poe.tasks.test]
help = "Run test suite"
cmd = "djx test"

[tool.poe.tasks.ci]
help = "Run everything used in CI"
sequence = [{ ref = "lint" }, { ref = "test" }]

[tool.ruff]
exclude = ["*/migrations/*"]

[tool.djlint]
format_css = true
format_js = true
blank_line_before_tag = "block,list"
blank_line_after_tag = "endblock,endlist"
ignore = "H016,H030,H031"

[tool.vercel.scripts]
build = "djx migrate --noinput"
